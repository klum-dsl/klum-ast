plugins {
    id 'groovy-gradle-plugin'
}

repositories {
    gradlePluginPortal() // so that external plugins can be resolved in dependencies section
    mavenCentral()
}

dependencies {
    implementation 'org.commonmark:commonmark:0.28.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.28.0'
    testImplementation gradleTestKit()
    testImplementation 'org.spockframework:spock-core:2.4-groovy-3.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    def rootSettings = layout.projectDirectory.file('../settings.gradle')
    inputs.file(rootSettings).withPropertyName('laneFixtureSettings')
    systemProperty 'klum.laneFixtureSettings', rootSettings.asFile.absolutePath
    def releaseBuild = layout.projectDirectory.file('../build.gradle')
    inputs.file(releaseBuild).withPropertyName('protectedReleaseBuild')
    systemProperty 'klum.releaseBuild', releaseBuild.asFile.absolutePath
}
