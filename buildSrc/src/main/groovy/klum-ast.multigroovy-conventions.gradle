import com.blackbuild.klum.ast.testing.VerifyTestLaneIsolationTask
import com.blackbuild.klum.ast.testing.VerifyTestLaneIsolationTask.Lane

plugins {
    id "klum-ast.java-conventions"
    id 'jvm-test-suite'
}

dependencies {
    testImplementation libs.bundles.spock.groovy.v3
}

configurations {
    sharedTests
}

configurations.matching { it.name in ["testImplementation", "groovy4TestsImplementation", "groovy5TestsImplementation"]}.configureEach {
    extendsFrom(configurations.sharedTests)
}

testing {
    suites {
        test {
            useSpock(libs.versions.spock.g3)
        }

        withType(JvmTestSuite).matching { it.name.startsWith("groovy") }.configureEach {
            def groovyVersion = it.name.charAt(6)
            useSpock(libs.versions.spock."g$groovyVersion")

            sources {
                groovy {
                    srcDirs = ['src/test/groovy']
                    destinationDirectory = file("build/classes/groovy/test-g$groovyVersion")
                }
                java {
                    srcDirs = ['src/test/java']
                }
                resources {
                    srcDirs = ['src/test/resources']
                }
            }

            dependencies {
                implementation project()
                implementation libs.jb.anno
                implementation libs.spock.junit4."g$groovyVersion"
                implementation libs.groovy."v$groovyVersion"
                implementation platform(libs.groovy."v$groovyVersion".bom)
                implementation 'uk.org.webcompere:system-stubs-core:2.1.8'
                runtimeOnly libs.bytebuddy
                runtimeOnly libs.objenesis
                runtimeOnly libs.jpl

            }
        }
        groovy4Tests(JvmTestSuite)
        groovy5Tests(JvmTestSuite)
    }
}

def testLanes = [
        3: [
                sourceSet : sourceSets.test,
                classpath : configurations.testRuntimeClasspath,
                compileTask: tasks.named('compileTestGroovy'),
                testTask   : tasks.named('test')
        ],
        4: [
                sourceSet : sourceSets.groovy4Tests,
                classpath : configurations.groovy4TestsRuntimeClasspath,
                compileTask: tasks.named('compileGroovy4TestsGroovy'),
                testTask   : tasks.named('groovy4Tests')
        ],
        5: [
                sourceSet : sourceSets.groovy5Tests,
                classpath : configurations.groovy5TestsRuntimeClasspath,
                compileTask: tasks.named('compileGroovy5TestsGroovy'),
                testTask   : tasks.named('groovy5Tests')
        ]
]

tasks.register('verifyTestLaneIsolation', VerifyTestLaneIsolationTask) {
    group = 'verification'
    description = 'Verifies matching Groovy/Spock dependencies, isolated test output, and lane-specific JUnit results.'
    dependsOn testLanes.values()*.testTask
    mustRunAfter testLanes.values()*.testTask

    testLanes.each { generation, lane ->
        def sourceSet = lane.sourceSet
        def input = objects.newInstance(Lane)
        input.generation.set(generation)
        input.groovyVersion.set(libs.versions.groovy."v$generation")
        input.spockVersion.set(libs.versions.spock."g$generation")
        input.modules.set(lane.classpath.incoming.resolutionResult.rootComponent.map { Lane.moduleCoordinates(it) })
        // Value providers are evaluated after all project customization, including source-set output overrides.
        // Snapshot path membership, not file contents: the verifier checks isolation, while producers track bytes.
        input.classes.set(sourceSet.output.classesDirs.elements.map { it.collect { it.asFile.absolutePath } })
        input.resources.set(providers.provider { [sourceSet.output.resourcesDir?.absolutePath].findAll { it != null } })
        input.sourceSetCompileClasspath.set(providers.provider { sourceSet.compileClasspath.files.collect { it.absolutePath } })
        input.groovyCompileClasspath.set(lane.compileTask.map { it.classpath.files.collect { it.absolutePath } })
        input.testRuntimeClasspath.set(lane.testTask.map { it.classpath.files.collect { it.absolutePath } })
        input.testClasses.set(lane.testTask.map { it.testClassesDirs.files.collect { it.absolutePath } })
        input.expectedResults.set(layout.buildDirectory.dir("test-results/${lane.testTask.name}").map { it.asFile.absolutePath })
        input.actualResults.set(lane.testTask.map { it.reports.junitXml.outputLocation.get().asFile.absolutePath })
        lanes.add(input)
    }
}

// Need to add test fixtures as source, since we compile with different spock versions
tasks.withType(GroovyCompile).configureEach {
    if (!name.contains("Test") || name.contains("Fixtures")) return
    it.source(project(':klum-ast').sourceSets.testFixtures.groovy.srcDirs)
}

tasks.named('check') {
    dependsOn(testing.suites.groovy4Tests)
    dependsOn(testing.suites.groovy5Tests)
    dependsOn(tasks.named('verifyTestLaneIsolation'))
}
