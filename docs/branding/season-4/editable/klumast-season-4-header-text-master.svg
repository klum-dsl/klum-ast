<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="660" viewBox="300 100 1980 660" role="img" aria-labelledby="title desc">
  <title id="title">KlumAST Season 4 header lockup</title>
  <desc id="desc">The KlumAST wordmark sits beside a luminous portal, two unroped graphite stanchions, and a catwalk that softly dissolves before the icon crop.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#041321"/>
      <stop offset="1" stop-color="#071b2c"/>
    </linearGradient>
    <radialGradient id="portalLight" cx="44%" cy="42%" r="80%">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="0.7" stop-color="#f6f0e8"/>
      <stop offset="1" stop-color="#ede5dc"/>
    </radialGradient>
    <linearGradient id="runway" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fbf6ef"/>
      <stop offset="1" stop-color="#eee4d8"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9bceea" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5da4d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#485360" stop-opacity=".42"/>
      <stop offset="1" stop-color="#27313e" stop-opacity=".12"/>
    </linearGradient>
    <filter id="portalGlow" x="-25%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadowBlur" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <pattern id="runwayPattern" width="30" height="26" patternUnits="userSpaceOnUse" patternTransform="skewX(-29)">
      <path d="M0 0H30M0 13H30M15 0V26" fill="none" stroke="#cfc5b9" stroke-opacity=".19" stroke-width="1"/>
    </pattern>
    <clipPath id="runwayClip">
      <path d="M340 611H584L1472 945H669Z"/>
    </clipPath>

    <!-- Restrained atmospheric embellishments; all remain editable vectors. -->
    <filter id="guide-glow" x="-60%" y="-25%" width="220%" height="150%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="frame-glare" x="-17%" y="-17%" width="134%" height="134%"><feGaussianBlur stdDeviation="6.2"/></filter>
    <filter id="god-ray-soften" x="-20%" y="-20%" width="150%" height="150%"><feGaussianBlur stdDeviation="12"/></filter>
    <linearGradient id="receding-seam" gradientUnits="userSpaceOnUse" x1="421" y1="611" x2="350" y2="565">
      <stop offset="0" stop-color="#c9bcae" stop-opacity=".30"/>
      <stop offset=".68" stop-color="#c9bcae" stop-opacity=".12"/>
      <stop offset="1" stop-color="#c9bcae" stop-opacity="0"/>
    </linearGradient>
    <!-- Approved faceted vector shadow, with a directionally increasing blur. -->
    <linearGradient id="shadow-vector-tone" gradientUnits="userSpaceOnUse" x1="470" y1="611" x2="1114" y2="945">
      <stop offset="0" stop-color="#1c2938" stop-opacity=".62"/>
      <stop offset=".44" stop-color="#1c2938" stop-opacity=".46"/>
      <stop offset="1" stop-color="#1c2938" stop-opacity=".20"/>
    </linearGradient>
    <linearGradient id="crisp-reveal" gradientUnits="userSpaceOnUse" x1="470" y1="611" x2="1114" y2="945">
      <stop offset="0" stop-color="white"/><stop offset=".42" stop-color="white"/>
      <stop offset=".80" stop-color="black"/><stop offset="1" stop-color="black"/>
    </linearGradient>
    <linearGradient id="soft-reveal" gradientUnits="userSpaceOnUse" x1="470" y1="611" x2="1114" y2="945">
      <stop offset="0" stop-color="black"/><stop offset=".30" stop-color="black"/>
      <stop offset=".72" stop-color="white"/><stop offset="1" stop-color="white"/>
    </linearGradient>
    <mask id="crisp-shadow"><rect width="1680" height="945" fill="url(#crisp-reveal)"/></mask>
    <mask id="soft-shadow"><rect width="1680" height="945" fill="url(#soft-reveal)"/></mask>
    <filter id="far-shadow-soften" x="-12%" y="-25%" width="130%" height="150%"><feGaussianBlur stdDeviation="7"/></filter>
    <g id="approved-shadow-vector"><!-- Derived from the approved manual PNG; path data is editable vector geometry. -->
<path d="M 469 607 L 494 621 L 502 628 L 501 633 L 478 620 Z M 521 643 L 597 690 L 733 758 L 747 769 L 870 818 L 961 873 L 1114 945 L 920 942 L 856 903 L 809 885 L 771 860 L 723 838 L 690 797 L 577 710 L 539 687 L 529 679 L 529 670 L 700 784 L 733 792 L 740 798 L 745 797 L 744 792 L 665 738 L 532 661 L 521 652 Z M 738 817 L 760 839 L 784 854 L 834 869 L 823 857 L 784 838 L 765 823 Z M 854 830 L 883 856 L 914 867 L 872 836 Z" fill="url(#shadow-vector-tone)" fill-rule="evenodd"/>
</g>
    <linearGradient id="post-shadow-tone" gradientUnits="userSpaceOnUse" x1="410" y1="630" x2="1170" y2="945">
      <stop offset="0" stop-color="#1c2938" stop-opacity=".50"/>
      <stop offset=".42" stop-color="#1c2938" stop-opacity=".37"/>
      <stop offset="1" stop-color="#1c2938" stop-opacity=".045"/>
    </linearGradient>
    <filter id="post-shadow-soft" x="-14%" y="-18%" width="130%" height="140%"><feGaussianBlur stdDeviation="7.5"/></filter>
    <filter id="rope-glow" x="-35%" y="-30%" width="170%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <linearGradient id="lower-edge-dissolve" gradientUnits="userSpaceOnUse" x1="0" y1="730" x2="0" y2="760">
      <stop offset="0" stop-color="#071b2c" stop-opacity="0"/>
      <stop offset="1" stop-color="#071b2c" stop-opacity=".92"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="2280" height="945" fill="url(#ink)"/>
  <path d="M0 0H540L0 470Z" fill="#0a2033" opacity=".26"/>
  <path d="M0 792L340 610V945H0Z" fill="#082037" opacity=".25"/>
  <path d="M584 610C700 590 790 590 935 700L660 945H340Z" fill="#0e2a3e" opacity=".14"/>

  <!-- threshold light is deliberately quiet -->
  <path d="M340 607C430 588 515 591 651 642L522 676C444 630 386 624 332 642Z" fill="#8ec8eb" opacity=".22" filter="url(#portalGlow)"/>
  <path d="M570 608C685 605 790 625 886 680L685 676C635 642 606 628 567 626Z" fill="url(#cone)" opacity=".38" filter="url(#soften)"/>
  <path d="M340 610C282 632 246 662 212 710L373 655C429 631 474 625 512 629Z" fill="url(#cone)" opacity=".3" filter="url(#soften)"/>

  <!-- catwalk -->
  <path d="M340 611H584L1472 945H669Z" fill="url(#runway)"/>
  <path d="M340 611H584L1472 945H669Z" fill="url(#runwayPattern)" opacity=".74"/>
  <path d="M340 611H584L1472 945" fill="none" stroke="#fffaf2" stroke-opacity=".65" stroke-width="2"/>

  <!-- Large, sparse tile seams reinforce the catwalk perspective. -->
  <g clip-path="url(#runwayClip)" fill="none" stroke="#c9bcae" stroke-opacity=".28" stroke-width="1.15">
    <path d="M421 611L936 945M503 611L1205 945"/>
    <path d="M378 650H688M438 710H847M497 770H1007M556 830H1166M615 890H1326"/>
  </g>


  <!-- portal: one chamfer, exact threshold end -->
  <path d="M340 611V167L396 110H584V611Z" fill="url(#portalLight)"/>
  <!-- I4b refinement: two restrained backstage planes give the aperture depth at small scale. -->
  <path d="M455 110H584V611H548C547 412 518 223 455 110Z" fill="#d8e8ef" opacity=".19"/>
  <path d="M396 110H455C518 223 547 412 548 611H519C494 408 454 237 396 110Z" fill="#ffffff" opacity=".20"/>

  <path d="M340 611V167L396 110H584" fill="none" stroke="#fffaf5" stroke-width="2" stroke-opacity=".92"/>
  <path d="M584 110V611" fill="none" stroke="#e2ddd6" stroke-width="2" stroke-opacity=".55"/>

  <!-- soft glare rides the portal edge without thickening its geometry. -->
  <path d="M340 611V167L396 110H584V611" fill="none" stroke="#8bc9e9" stroke-width="11" stroke-opacity=".50" filter="url(#frame-glare)"/>
  <!-- The left tile seam continues straight through the threshold and vanishes. -->
  <g fill="none" stroke="url(#receding-seam)" stroke-width="1.15">
    <path d="M421 611L350 565"/>
  </g>
  <!-- I4: post bases are on the catwalk immediately in front of the portal. -->
  <g clip-path="url(#runwayClip)" fill="#1c2938">
    <!-- Rays from (410,630)–(430,630) and (510,630)–(530,630) through the
         runway vanishing point (197,466): no field is invented between them. -->
    <path d="M410 630H430L878 945H820Z" fill="url(#post-shadow-tone)"/>
    <path d="M510 630H530L1170 945H1112Z" fill="url(#post-shadow-tone)"/>
    <g filter="url(#post-shadow-soft)" opacity=".30">
      <path d="M410 630H430L878 945H820Z"/>
      <path d="M510 630H530L1170 945H1112Z"/>
    </g>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round">

    <g fill="none" stroke="#1c2938">
      <path d="M420 480V624" stroke-width="8" stroke-opacity=".94"/>
      <path d="M520 480V624" stroke-width="8" stroke-opacity=".94"/>
      <path d="M400 630Q420 616 440 630" stroke-width="6.5" stroke-opacity=".88"/>
      <path d="M500 630Q520 616 540 630" stroke-width="6.5" stroke-opacity=".88"/>
    </g>
    <g fill="none" stroke="#cbdde5" stroke-width="1.7" stroke-opacity=".90">
      <path d="M423 486V619"/><path d="M523 486V619"/>
    </g>
    <g fill="#263746" stroke="#d4e4ea" stroke-width="1.4">
      <circle cx="420" cy="476" r="8.5"/><circle cx="520" cy="476" r="8.5"/>
    </g>

  </g>

  <!-- Optical crop correction: the runway dissolves before the otherwise invisible canvas edge. -->
  <rect x="300" y="730" width="1050" height="30" fill="url(#lower-edge-dissolve)"/>

  <!-- The header wordmark belongs to the portal mark rather than to surrounding UI text. -->
  <text x="1865" y="500" text-anchor="end" fill="#f9f6f1" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="260" font-weight="400" letter-spacing="3">KlumAST</text>
</svg>
