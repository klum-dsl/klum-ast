<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 945" role="img" aria-labelledby="title desc">
  <title id="title">KlumAST 4.2 lettering study A</title>
  <desc id="desc">Unselected native lettering suggestion. Make Your Models combines raised Groovy and lowered YAML, with YAML given stronger readable emphasis. The mosaic YAML figure is left of the flowing Groovy figure.</desc>
  <g id="artwork" />
  <g font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="1504" y="291" text-anchor="end" font-size="186.1" font-weight="300" letter-spacing="3" fill="#f9f6f1">KlumAST</text>
    <text x="1504" y="391" text-anchor="end" font-size="64" font-weight="300" letter-spacing=".5" fill="#f9f6f1">Make Your Models</text>
    <text x="1190" y="463" text-anchor="end" font-size="90" font-weight="300" letter-spacing=".5" fill="#f9f6f1">Groovy</text>
    <text x="1504" y="495" text-anchor="end" font-size="108" font-weight="400" letter-spacing=".5" fill="#f9f6f1">YAML</text>
    <text x="1504" y="610" text-anchor="end" font-size="40" font-weight="300" letter-spacing=".5" fill="#f9f6f1">Season 4.2</text>
  </g>
</svg>
