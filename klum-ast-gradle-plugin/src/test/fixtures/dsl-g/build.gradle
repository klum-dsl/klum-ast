import org.gradle.api.plugins.JavaPluginExtension
import org.gradle.plugins.ide.idea.model.IdeaModel

plugins {
    id 'base'
    id 'com.blackbuild.convention.groovy'
}

groovyDependencies {
    groovyVersion = '3'
}

allprojects {
    repositories {
        mavenCentral()
    }
}

tasks.register('assertKlumDslSourceMirrorAggregate') {
    doLast {
        def aggregate = tasks.named('generateAllKlumDslSourceMirrors').get()
        def expected = providers.gradleProperty('expectedKlumDslSourceMirrorProjects').orElse(':schema').get()
                .split(',')
                .collect { "$it:createKlumDslSourceMirrors" } as Set
        def actual = aggregate.taskDependencies.getDependencies(aggregate)*.path as Set
        println "aggregate.name=${aggregate.name}"
        println "aggregate.actions=${aggregate.actions.empty}"
        println "aggregate.outputs=${aggregate.outputs.files.files.empty}"
        println "aggregate.dependencies=${actual.sort().join(',')}"
        assert aggregate.name == 'generateAllKlumDslSourceMirrors'
        assert aggregate.actions.empty
        assert aggregate.outputs.files.files.empty
        assert actual == expected
    }
}
