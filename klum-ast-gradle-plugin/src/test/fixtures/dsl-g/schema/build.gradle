import org.gradle.api.plugins.JavaPluginExtension
import org.gradle.plugins.ide.idea.model.IdeaModel

plugins {
    id 'com.blackbuild.klum-ast-schema'
    id 'maven-publish'
}

klumSchema {
    groovyVersion = providers.gradleProperty('fixtureGroovyVersion').orElse('3').get()
}

// The fixture supplies a synthetic AST output and resolves its generated public descriptor from Maven Central.
configurations.api.dependencies.clear()
configurations.compileOnly.dependencies.clear()

dependencies {
    compileOnly 'com.blackbuild.klum.ast:klum-ast-runtime:4.0.0-rc.14'
    compileOnly files(rootProject.file('klum-gdsl-runtime.jar'))
}

tasks.named('compileJava') {
    classpath = files()
}

tasks.named('compileGroovy') {
    source(fileTree('compiler-input'))
    classpath = configurations.compileClasspath
    groovyClasspath = configurations.groovy
}

// The generic fixture input is also visible to AnnoDocimal's Javadoc stub task, which is not KlumAST-created.
tasks.named('createClassStubs') {
    referencedClassesClasspath.from(configurations.compileClasspath)
}

publishing {
    repositories {
        maven {
            name = 'fixture'
            url = layout.buildDirectory.dir('repository')
        }
    }
}

tasks.register('assertKlumDslIdeModel') {
    doLast {
        def mirror = project.layout.buildDirectory.dir('generated/sources/klum-dsl-ide/main').get().asFile.canonicalFile
        def idea = project.extensions.getByType(IdeaModel)
        println "idea.source=${idea.module.sourceDirs*.canonicalFile.contains(mirror)}"
        println "idea.generated=${idea.module.generatedSourceDirs*.canonicalFile.contains(mirror)}"
        println "idea.mirrorExists=${mirror.exists()}"
        assert idea.module.sourceDirs*.canonicalFile.contains(mirror)
        assert idea.module.generatedSourceDirs*.canonicalFile.contains(mirror)
        assert !mirror.exists()
    }
}

tasks.register('assertKlumDslIsolation') {
    doLast {
        def java = project.extensions.getByType(JavaPluginExtension)
        def main = java.sourceSets.main
        def mirror = project.layout.buildDirectory.dir('generated/sources/klum-dsl-ide/main').get().asFile.canonicalFile
        def gdsl = rootProject.layout.buildDirectory.dir('generated/klum-dsl-ide/gdsl').get().asFile.canonicalFile
        def containsMirror = { files ->
            files.files.any {
                def candidate = it.canonicalFile
                candidate == mirror || candidate.path.startsWith(mirror.path + File.separator)
            }
        }
        def containsGdsl = { files ->
            files.files.any {
                def candidate = it.canonicalFile
                candidate == gdsl || candidate.path.startsWith(gdsl.path + File.separator)
            }
        }
        def mirrorTask = tasks.named('createKlumDslSourceMirrors').get()
        def checks = [
                'sourceSet.java'       : containsMirror(main.java.sourceDirectories),
                'sourceSet.groovy'     : containsMirror(main.groovy.sourceDirectories),
                'compileJava.source'   : containsMirror(tasks.compileJava.source),
                'compileJava.classpath': containsMirror(tasks.compileJava.classpath),
                'compileGroovy.source' : containsMirror(tasks.compileGroovy.source),
                'compileGroovy.classpath': containsMirror(tasks.compileGroovy.classpath),
                'classes.dependency'   : tasks.classes.taskDependencies.getDependencies(tasks.classes).contains(mirrorTask),
                'test.dependency'      : tasks.test.taskDependencies.getDependencies(tasks.test).contains(mirrorTask),
                'sourcesJar.source'    : containsMirror(tasks.sourcesJar.source),
                'javadoc.source'       : containsMirror(tasks.javadoc.source),
                'jar.source'           : containsMirror(tasks.jar.source),
                'runtimeClasspath'     : containsMirror(main.runtimeClasspath),
                'testClasspath'        : containsMirror(java.sourceSets.test.runtimeClasspath),
                'publication.artifact' : publishing.publications.mavenJava.artifacts*.file*.canonicalFile.contains(mirror),
                'outgoing.artifact'    : configurations.collectMany { it.outgoing.artifacts.files.files }*.canonicalFile.contains(mirror)
        ]
        checks.each { name, consumed ->
            println "isolation.${name}=${consumed}"
            assert !consumed
        }
        checks.collectEntries { name, ignored ->
            [(name): containsGdsl(
                    name == 'sourceSet.java' ? main.java.sourceDirectories :
                    name == 'sourceSet.groovy' ? main.groovy.sourceDirectories :
                    name == 'compileJava.source' ? tasks.compileJava.source :
                    name == 'compileJava.classpath' ? tasks.compileJava.classpath :
                    name == 'compileGroovy.source' ? tasks.compileGroovy.source :
                    name == 'compileGroovy.classpath' ? tasks.compileGroovy.classpath :
                    name == 'sourcesJar.source' ? tasks.sourcesJar.source :
                    name == 'javadoc.source' ? tasks.javadoc.source :
                    name == 'jar.source' ? tasks.jar.source :
                    name == 'runtimeClasspath' ? main.runtimeClasspath :
                    name == 'testClasspath' ? java.sourceSets.test.runtimeClasspath :
                    name == 'publication.artifact' ? project.files(publishing.publications.mavenJava.artifacts*.file) :
                    name == 'outgoing.artifact' ? project.files(configurations.collectMany { it.outgoing.artifacts.files.files }) : project.files())]
        }.each { name, consumed ->
            println "gdsl.isolation.${name}=${consumed}"
            assert !consumed
        }
        assert !tasks.classes.taskDependencies.getDependencies(tasks.classes).contains(mirrorTask)
        assert !tasks.test.taskDependencies.getDependencies(tasks.test).contains(mirrorTask)
    }
}

tasks.register('assertKlumDslReferencedClassesClasspath') {
    doLast {
        def mirrorTask = tasks.named('createKlumDslSourceMirrors').get()
        def nestedFactoryProvider = 'com.blackbuild.klum.ast.runtime.KlumFactory$BuilderFactoryProvider'
        assert mirrorTask.referencedClassesClasspath.files == configurations.compileClasspath.files
        try {
            mirrorTask.class.classLoader.loadClass(nestedFactoryProvider)
            assert false: "The plugin classloader unexpectedly contains ${nestedFactoryProvider}"
        } catch (ClassNotFoundException ignored) {
            println 'projection.pluginLoaderContainsFactoryProvider=false'
        }
    }
}
