plugins {
    id 'java'
}

dependencies {
    implementation project(':schema')
    testImplementation 'org.codehaus.groovy:groovy:3.0.25'
}

tasks.register('assertKlumDslDownstreamIsolation') {
    doLast {
        def mirror = project(':schema').layout.buildDirectory.dir('generated/sources/klum-dsl-ide/main').get().asFile.canonicalFile
        def gdsl = rootProject.layout.buildDirectory.dir('generated/klum-dsl-ide/gdsl').get().asFile.canonicalFile
        def containsMirror = { files -> files.files*.canonicalFile.contains(mirror) }
        def containsGdsl = { files -> files.files*.canonicalFile.contains(gdsl) }
        def checks = [
                'compileClasspath': containsMirror(configurations.compileClasspath),
                'runtimeClasspath': containsMirror(configurations.runtimeClasspath),
                'testCompileClasspath': containsMirror(configurations.testCompileClasspath),
                'testRuntimeClasspath': containsMirror(configurations.testRuntimeClasspath)
        ]
        checks.each { name, consumed ->
            println "downstream.${name}=${consumed}"
            assert !consumed
        }
        checks.collectEntries { name, ignored -> [(name): containsGdsl(
                name == 'compileClasspath' ? configurations.compileClasspath :
                name == 'runtimeClasspath' ? configurations.runtimeClasspath :
                name == 'testCompileClasspath' ? configurations.testCompileClasspath :
                configurations.testRuntimeClasspath)]
        }.each { name, consumed ->
            println "gdsl.downstream.${name}=${consumed}"
            assert !consumed
        }
    }
}
