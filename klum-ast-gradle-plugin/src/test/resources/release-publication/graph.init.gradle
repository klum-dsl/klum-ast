import org.gradle.api.GradleException
import org.gradle.api.publish.maven.tasks.PublishToMavenRepository
import org.gradle.api.publish.maven.tasks.PublishToMavenLocal
import org.gradle.plugins.signing.Sign
import org.gradle.plugins.signing.signatory.Signatory

// Issue #903: inspect actual plugin task ancestry without selecting a publication or signing action.
gradle.projectsEvaluated {
    def product = gradle.rootProject
    if (product.name != 'klum-ast-root') return
    def probe = product.tasks.register('verifyProtectedPublicationAncestry') {
        notCompatibleWithConfigurationCache('This test probe inspects the live task model.')
        doLast {
            def ancestors
            ancestors = { task, Set visited ->
                task.taskDependencies.getDependencies(task).each { dependency ->
                    if (visited.add(dependency.path)) ancestors(dependency, visited)
                }
                visited
            }
            def normal = [product.tasks.named('check').get()]
            product.subprojects.each { module ->
                normal.addAll(module.tasks.withType(PublishToMavenLocal))
                ['compileJava', 'jar', 'javadoc'].each { name ->
                    if (module.tasks.findByName(name)) normal.add(module.tasks.named(name).get())
                }
            }
            normal.each { operation ->
                if (ancestors(operation, [] as Set).contains(':verifyProtectedReleaseAuthorization'))
                    throw new GradleException("Ordinary unsigned development is guarded: ${operation.path}")
            }
            def operations = ['initializeSonatypeStagingRepository', 'closeSonatypeStagingRepository',
                              'releaseSonatypeStagingRepository', 'closeAndReleaseSonatypeStagingRepository']
                    .collect { product.tasks.named(it).get() }
            operations.add(product.project(':klum-ast-gradle-plugin').tasks.named('publishPlugins').get())
            int signingTasks = 0
            int uploads = 0
            product.subprojects.each { module ->
                module.tasks.withType(PublishToMavenRepository).each { upload ->
                    if (upload.repository.name == 'sonatype' ||
                            !upload.repository.url.scheme?.equalsIgnoreCase('file') || upload.repository.url.authority != null) {
                        operations.add(upload)
                        uploads++
                    }
                }
                module.tasks.withType(Sign).each { signing ->
                    // This object has no key and can never sign. It only activates the real key-use graph branch.
                    signing.signatory = [getName: { 'ancestry-probe' }, getKeyId: { 'synthetic' },
                                         sign: { input, output -> throw new AssertionError('Signing is forbidden in the graph probe') }] as Signatory
                    operations.add(signing)
                    signingTasks++
                }
            }
            def required = [':verifyProtectedReleaseAuthorization', ':verifyReleaseVersion',
                            ':verifyVersionedDocumentationRenderer', ':check']
            operations.each { operation ->
                Set actual = ancestors(operation, [] as Set)
                if (!actual.containsAll(required))
                    throw new GradleException("Missing protected prerequisites for ${operation.path}: ${required - actual}")
            }
            assert signingTasks > 0 && uploads > 0
            logger.lifecycle("Verified ${operations.size()} protected operations ($signingTasks signing, $uploads Maven uploads), and ${normal.size()} unsigned development entries.")
        }
    }
    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(probe.get()) && graph.allTasks != [probe.get()])
            throw new GradleException('The graph probe must be the only selected task; no release actions are allowed.')
    }
}
