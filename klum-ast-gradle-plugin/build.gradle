plugins {
    id "klum-ast.base-conventions"
    id "klum-ast.jacoco-conventions"
    id 'com.gradle.plugin-publish'
    id 'java-gradle-plugin'
    id 'groovy'
}

description = "KlumAST Gradle Plugins"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

gradlePlugin {
    plugins {
        klumAstSchmemaPlugin {
            id = 'com.blackbuild.klum-ast-schema'
            displayName = 'Plugin for KlumAST schema projects'
            description = 'preconfigures a project to produce a KlumAST schema'
            implementationClass = 'com.blackbuild.klum.ast.gradle.KlumAstSchemaPlugin'
            tags.addAll  'groovy', 'model', 'dsl', "klum", "ast"
        }
        klumAstModelPlugin {
            id = 'com.blackbuild.klum-ast-model'
            displayName = 'Plugin for KlumAST model projects'
            description = 'preconfigures a project to produce a KlumAST model'
            implementationClass = 'com.blackbuild.klum.ast.gradle.KlumAstModelPlugin'
            tags.addAll  'groovy', 'model', 'dsl', "klum", "ast"
        }
        groovyDependenciesPlugin {
            id = 'com.blackbuild.convention.groovy'
            displayName = 'Groovy dependencies'
            description = 'Adds Groovy and Spock dependencies to the project'
            implementationClass = 'com.blackbuild.klum.ast.gradle.convention.GroovyDependenciesPlugin'
            tags.addAll  'groovy', 'spock'
        }
    }

    website = 'https://github.com/klum-dsl/klum-ast'
    vcsUrl = 'https://github.com/klum-dsl/klum-ast.git'
    description = project.description
}

dependencies {
    api libs.annodocimal.gradle.plugin
    // The private projector links to the facade only in the isolated consumer contract loader.
    // No runtime artifact enters the plugin's published dependency graph.
    compileOnly project(':klum-ast-runtime')
    // all dependencies are compile time dependencies (for AST "runtime" is compile time of a client project")
    testImplementation libs.spock.g3
    testImplementation 'org.yaml:snakeyaml:2.6'
    testImplementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    testRuntimeOnly project(':klum-ast-runtime')
}

tasks.register('generatePluginVersionMarker', WriteProperties) {
    destinationFile = layout.buildDirectory.file("versionMarker/com.blackbuild.klum.ast.gradle.AbstractKlumPlugin")
    comment = "current plugin version"
    property("version", project.version)
}

processResources {
    from(files(tasks.generatePluginVersionMarker)) {
        into("META-INF/versions")
    }
}

test {
    useJUnitPlatform()
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    systemProperty 'schemaPluginJar', tasks.named('jar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath
    systemProperty 'schemaValidationDirectory', layout.buildDirectory.dir('schema-validation').get().asFile.absolutePath

    def releaseBuild = rootProject.layout.projectDirectory.file('build.gradle')
    def baseConventions = rootProject.layout.projectDirectory.file('buildSrc/src/main/groovy/klum-ast.base-conventions.gradle')
    inputs.files(releaseBuild, baseConventions).withPropertyName('protectedPublicationContract')
    systemProperty 'klum.releaseBuild', releaseBuild.asFile.absolutePath
    systemProperty 'klum.baseConventions', baseConventions.asFile.absolutePath

    def portalPlugin = new File(plugins.getPlugin('com.gradle.plugin-publish').class.protectionDomain.codeSource.location.toURI())
    inputs.file(portalPlugin).withPropertyName('protectedPublicationPortalPlugin')
    systemProperty 'klum.portalPlugin', portalPlugin.absolutePath

    inputs.files(rootProject.file('.github/scripts/verify-release-ci.cjs'),
            rootProject.fileTree('.github/workflows'))
    systemProperty 'klum.repositoryRoot', rootProject.projectDir.absolutePath

    inputs.files(
            project(":klum-ast").tasks.named("jar", Jar).flatMap { it.archiveFile }
    )
}

publishing {
    publications {
        pluginMaven(MavenPublication)
    }
}

// Independent binary GDSL fixtures use real transformed contracts and one Groovy runtime per generation.
gradle.projectsEvaluated {
    def compiler = project(':klum-ast')
    def runtime = project(':klum-ast-runtime')
    def compilerFiles = files(compiler.tasks.named('jar'), compiler.configurations.runtimeClasspath)
            .filter { !it.name.startsWith('groovy-') }
    def runtimeFiles = files(runtime.tasks.named('jar'), runtime.configurations.runtimeClasspath)
            .filter { !it.name.startsWith('groovy-') }
    tasks.named('test', Test) {
        inputs.files(compilerFiles, runtimeFiles)
        systemProperty 'schemaValidationApi', configurations.testRuntimeClasspath.files.find { it.name == 'jakarta.validation-api-3.0.2.jar' }.absolutePath
        systemProperty 'gdslCompilerClasspath', compilerFiles.asPath
        systemProperty 'gdslRuntimeClasspath', runtimeFiles.asPath
        ['3': 'compileClasspath', '4': 'groovy4TestsCompileClasspath', '5': 'groovy5TestsCompileClasspath'].each { generation, configuration ->
            def groovyJar = compiler.configurations[configuration].files.find { it.name ==~ /groovy-[345]\..*\.jar/ }
            inputs.file(groovyJar)
            systemProperty "gdslGroovy$generation", groovyJar.absolutePath
        }
    }
}
