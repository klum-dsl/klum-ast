name: Probe reusable Pages writer secrets

on:
  workflow_call:
    inputs:
      stage:
        description: Unused release-stage input retained to exercise the real caller shape.
        required: true
        type: string
      version:
        description: Unused release-version input retained to exercise the real caller shape.
        required: true
        type: string
      commit:
        description: Unused release-commit input retained to exercise the real caller shape.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-environment-secrets:
    name: Verify protected Pages writer credentials are present
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: documentation-pages-writer
    steps:
      - name: Require protected Pages writer credentials
        env:
          PAGES_WRITER_APP_ID: ${{ secrets.PAGES_WRITER_APP_ID }}
          PAGES_WRITER_APP_PRIVATE_KEY: ${{ secrets.PAGES_WRITER_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGES_WRITER_APP_ID"
          test -n "$PAGES_WRITER_APP_PRIVATE_KEY"
