name: Repair public documentation landing

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Exact stage of the already promoted public release"
        required: true
        type: choice
        options: [candidate, final]
      version:
        description: "Exact public version whose existing CSS and logo will be used"
        required: true
        type: string
      commit:
        description: "Full source commit recorded by the existing promotion"
        required: true
        type: string
      recovery_run:
        description: "Successful Recover incomplete public release record workflow run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: pending-documentation-gh-pages
  cancel-in-progress: false

jobs:
  validate-recovery:
    name: Validate the successful public release recovery
    runs-on: ubuntu-latest

    steps:
      - name: Require the exact completed recovery workflow from master
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
          RECOVERY_RUN: ${{ inputs.recovery_run }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/master
          if [[ "$RELEASE_STAGE" == candidate && "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || \
             [[ "$RELEASE_STAGE" == final && "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RECOVERY_RUN" =~ ^[1-9][0-9]*$ ]]
          else
            echo 'The landing-repair identity is malformed.' >&2
            exit 1
          fi
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          run_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$RECOVERY_RUN")"
          jq -e --arg repository "$GITHUB_REPOSITORY" \
            '.name == "Recover incomplete public release record" and .event == "workflow_dispatch" and
             .head_branch == "master" and .head_repository.full_name == $repository and
             .path == ".github/workflows/recover-public-release-record.yml" and .conclusion == "success"' \
            <<< "$run_json" > /dev/null || {
              echo 'The named run is not a successful trusted public-release recovery.' >&2
              exit 1
            }
          recovery_attempt="$(jq -er '.run_attempt' <<< "$run_json")"
          jobs_json="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/actions/runs/$RECOVERY_RUN/attempts/$recovery_attempt/jobs?per_page=100")"
          jq -e '.jobs | any(.[]; .name == "Validate the failed public-release finalization" and .conclusion == "success") and
            any(.[]; .name == "Validate the manually created release record" and .conclusion == "success")' \
            <<< "$jobs_json" > /dev/null || {
              echo 'The named recovery did not validate both the retained proof and the release record.' >&2
              exit 1
            }

  repair:
    name: Repair the styled root and release alias landings
    needs: validate-recovery
    runs-on: ubuntu-latest
    environment:
      name: documentation-pages-writer
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: gh-pages
          path: pages
          persist-credentials: false
      - id: landing
        name: Verify the existing immutable documentation before landing repair
        env:
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          test -f pages/.nojekyll
          manifest="pages/$RELEASE_VERSION/site-manifest.json"
          promotion_directory="pages/promotions/$RELEASE_VERSION/$EXPECTED_COMMIT"
          test -f "$manifest"
          test -d "$promotion_directory"
          promotions=("$promotion_directory"/*.json)
          test "${#promotions[@]}" = 1
          jq -e --arg stage "$RELEASE_STAGE" --arg version "$RELEASE_VERSION" --arg sha "$EXPECTED_COMMIT" \
            '.schemaVersion == 1 and .stage == $stage and .version == $version and .sha == $sha and
             .outcome == "promoted-public-documentation"' "${promotions[0]}" > /dev/null
          bash .github/scripts/write-documentation-landing.sh pages "$RELEASE_VERSION" "$RELEASE_STAGE"
          landing_paths=(index.html)
          if [[ "$RELEASE_STAGE" == candidate ]]; then
            landing_paths+=(preview/index.html)
          else
            landing_paths+=(stable/index.html "${RELEASE_VERSION%.*}/index.html")
          fi
          changed=false
          if ! git -C pages diff --quiet -- "${landing_paths[@]}"; then
            changed=true
            git -C pages add -- "${landing_paths[@]}"
            git -C pages -c user.name='klum-ast documentation bot' -c user.email='noreply@users.noreply.github.com' \
              commit -m "Repair documentation landing for $RELEASE_VERSION"
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "ledger_commit=$(git -C pages rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require protected Pages writer credentials
        if: steps.landing.outputs.changed == 'true'
        env:
          PAGES_WRITER_APP_ID: ${{ secrets.PAGES_WRITER_APP_ID }}
          PAGES_WRITER_APP_PRIVATE_KEY: ${{ secrets.PAGES_WRITER_APP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGES_WRITER_APP_ID"
          test -n "$PAGES_WRITER_APP_PRIVATE_KEY"
      - name: Mint the dedicated Pages writer token
        if: steps.landing.outputs.changed == 'true'
        id: pages-writer-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.PAGES_WRITER_APP_ID }}
          private-key: ${{ secrets.PAGES_WRITER_APP_PRIVATE_KEY }}
      - name: Write and read back the repaired Pages ledger
        if: steps.landing.outputs.changed == 'true'
        env:
          LEDGER_COMMIT: ${{ steps.landing.outputs.ledger_commit }}
          PAGES_WRITER_TOKEN: ${{ steps.pages-writer-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGES_WRITER_TOKEN"
          git -C pages push "https://x-access-token:${PAGES_WRITER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          git -C pages fetch --no-tags origin gh-pages
          test "$(git -C pages rev-parse FETCH_HEAD)" = "$LEDGER_COMMIT"
          git -C pages diff --quiet "$LEDGER_COMMIT" FETCH_HEAD
      - name: Upload the repaired Pages ledger
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: pages

  deploy-pages:
    name: Deploy the repaired public documentation landing
    needs: repair
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: documentation-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        name: Deploy the uploaded static site to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        with:
          timeout: 1800000
