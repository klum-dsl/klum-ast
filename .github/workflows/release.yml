name: Publish protected release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "The independently authorized release stage"
        required: true
        type: choice
        options:
          - candidate
          - final
      version:
        description: "Exact immutable version to publish, for example 4.0.0-rc.1"
        required: true
        type: string
      commit:
        description: "Full source commit SHA on master"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-release-input:
    name: Validate release stage and version
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.select-environment.outputs.name }}

    steps:
      - id: select-environment
        env:
          RELEASE_STAGE: ${{ inputs.stage }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_STAGE" == candidate && "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]; then
            echo 'name=release-candidate' >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASE_STAGE" == final && "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'name=final-release' >> "$GITHUB_OUTPUT"
          else
            echo 'The selected stage does not match the exact immutable version.' >&2
            exit 1
          fi

  verify-release-identity-available:
    name: Verify remote release identity availability
    needs: validate-release-input
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Reject an already used remote version or tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          assert_remote_identity_absent() {
            local identity="$1"
            local endpoint="$2"
            local status

            if ! status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$endpoint")"; then
              echo "Could not query the remote $identity state." >&2
              exit 1
            fi

            case "$status" in
              404) ;;
              200)
                echo "The remote $identity already exists; published versions are never retried in place." >&2
                exit 1
                ;;
              *)
                echo "Remote $identity query returned unexpected HTTP status $status." >&2
                exit 1
                ;;
            esac
          }

          assert_remote_identity_absent 'release tag' "git/ref/tags/v$RELEASE_VERSION"
          assert_remote_identity_absent 'GitHub release' "releases/tags/v$RELEASE_VERSION"

  stage-pending-documentation:
    name: Stage pending documentation for ${{ inputs.version }}
    needs: [validate-release-input, verify-release-identity-available]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-pending-documentation.yml
    secrets: inherit
    with:
      stage: ${{ inputs.stage }}
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}

  publish:
    name: Publish ${{ inputs.stage }} ${{ inputs.version }}
    needs: [validate-release-input, verify-release-identity-available, stage-pending-documentation]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ needs.validate-release-input.outputs.environment }}
    env:
      KLUM_AST_RELEASE_AUTHORIZED: ${{ inputs.stage }}
      ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.SONATYPE_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - name: Verify the authorized source commit
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          actual_commit=$(git rev-parse HEAD)
          test "$actual_commit" = "$EXPECTED_COMMIT"
          git merge-base --is-ancestor "$actual_commit" origin/master
          test -z "$(git status --porcelain=v1)"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Recheck remote release identity availability
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          assert_remote_identity_absent() {
            local identity="$1"
            local endpoint="$2"
            local status

            if ! status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$endpoint")"; then
              echo "Could not query the remote $identity state." >&2
              exit 1
            fi

            case "$status" in
              404) ;;
              200)
                echo "The remote $identity already exists; published versions are never retried in place." >&2
                exit 1
                ;;
              *)
                echo "Remote $identity query returned unexpected HTTP status $status." >&2
                exit 1
                ;;
            esac
          }

          assert_remote_identity_absent 'release tag' "git/ref/tags/v$RELEASE_VERSION"
          assert_remote_identity_absent 'GitHub release' "releases/tags/v$RELEASE_VERSION"
      - name: Require every protected credential before publication
        shell: bash
        run: |
          set -euo pipefail
          for credential in \
            ORG_GRADLE_PROJECT_sonatypeUsername \
            ORG_GRADLE_PROJECT_sonatypePassword \
            ORG_GRADLE_PROJECT_signingKey \
            ORG_GRADLE_PROJECT_signingPassword \
            GRADLE_PUBLISH_KEY \
            GRADLE_PUBLISH_SECRET
          do
            test -n "${!credential}" || {
              echo "The protected release environment is missing $credential." >&2
              exit 1
            }
          done
      - name: Recheck the pending documentation handoff
        env:
          DOCUMENTATION_STAGE: ${{ needs.stage-pending-documentation.outputs.stage }}
          DOCUMENTATION_VERSION: ${{ needs.stage-pending-documentation.outputs.version }}
          DOCUMENTATION_COMMIT: ${{ needs.stage-pending-documentation.outputs.commit }}
          DOCUMENTATION_EXACT_PATH: ${{ needs.stage-pending-documentation.outputs.exact_path }}
          DOCUMENTATION_MANIFEST_SHA256: ${{ needs.stage-pending-documentation.outputs.manifest_sha256 }}
          DOCUMENTATION_DEPLOYMENT_COMMIT: ${{ needs.stage-pending-documentation.outputs.deployment_commit }}
          DOCUMENTATION_DEPLOYMENT_ID: ${{ needs.stage-pending-documentation.outputs.deployment_id }}
          DOCUMENTATION_PAGE_URL: ${{ needs.stage-pending-documentation.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DOCUMENTATION_STAGE" = "${{ inputs.stage }}"
          test "$DOCUMENTATION_VERSION" = "${{ inputs.version }}"
          test "$DOCUMENTATION_COMMIT" = "${{ inputs.commit }}"
          test "$DOCUMENTATION_EXACT_PATH" = "pending/${{ inputs.version }}/${{ inputs.commit }}/"
          [[ "$DOCUMENTATION_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DOCUMENTATION_DEPLOYMENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DOCUMENTATION_DEPLOYMENT_ID" =~ ^[0-9]+\.[0-9]+$ ]]
          [[ "$DOCUMENTATION_PAGE_URL" =~ ^https:// ]]
      - name: Verify, sign, stage, and publish the complete product
        run: >-
          ./gradlew publishCompleteKlumAstProduct
          -Prelease.version=${{ inputs.version }}
          -Prelease.stage=${{ inputs.stage }}

  verify-public-gradle-plugins:
    name: Verify Gradle Plugin Portal markers
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Resolve every plugin marker from the Plugin Portal
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-plugin-portal-user-home
        run: >-
          ./gradlew --refresh-dependencies -p release/plugin-consumer verifyPublicPlugins
          -PreleaseVersion=${{ inputs.version }}
          --no-build-cache
          --no-daemon
      - name: Retain Plugin Portal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-plugin-portal-${{ inputs.version }}
          path: release/plugin-consumer/build/verification/**
          if-no-files-found: error

  await-public-maven-product:
    name: Await Maven Central product availability
    needs: verify-public-gradle-plugins
    runs-on: ubuntu-latest
    # Twelve attempts, ten minutes apart, make Maven Central availability a bounded
    # release gate while retaining one credential-free runner for the wait.
    timeout-minutes: 125

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      - name: Poll Maven Central for the complete public product
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            echo "Maven Central resolve attempt $attempt of 12."
            if GRADLE_USER_HOME="$RUNNER_TEMP/gradle-maven-central-$attempt" \
              ./gradlew --refresh-dependencies -p release/maven-consumer verifyPublicMavenProduct \
              -PreleaseVersion="$RELEASE_VERSION" --no-build-cache --no-daemon; then
              exit 0
            fi
            if [[ "$attempt" -lt 12 ]]; then
              echo 'The complete Maven product is not public yet; retrying in ten minutes.' >&2
              sleep 600
            fi
          done
          echo 'The complete Maven product did not become publicly resolvable within two hours.' >&2
          exit 1
      - name: Retain Maven Central evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-maven-central-${{ inputs.version }}
          path: release/maven-consumer/build/verification/**
          if-no-files-found: error
