plugins {
    id "klum-ast.multigroovy-conventions"
    id "klum-ast.jpms-descriptor-conventions"
    id "klum-ast.jacoco-conventions"
    id "java-test-fixtures"
}

description = "compileOnly part of KlumAST"

test {
    inputs.dir file("src/test/scenarios")
    outputs.dir layout.buildDirectory.dir("test-classes")
}

gradle.projectsEvaluated {
    tasks.withType(Test).configureEach {
        def klumAnnotationsPom = project(':klum-ast-annotations').layout.buildDirectory.file('publications/mavenJava/pom-default.xml')
        def klumRuntimePom = project(':klum-ast-runtime').layout.buildDirectory.file('publications/mavenJava/pom-default.xml')
        def klumBomPom = project(':klum-ast-bom').layout.buildDirectory.file('publications/mavenJava/pom-default.xml')
        dependsOn tasks.named('jar')
        dependsOn ':klum-ast-annotations:jar'
        dependsOn ':klum-ast-annotations:generatePomFileForMavenJavaPublication'
        dependsOn ':klum-ast-runtime:jar'
        dependsOn ':klum-ast-runtime:generatePomFileForMavenJavaPublication'
        dependsOn ':klum-ast-test-support:jar'
        dependsOn ':klum-ast-bom:generatePomFileForMavenJavaPublication'
        dependsOn ':klum-ast-jackson:jar'
        dependsOn ':klum-ast-bean-validation:jar'
        inputs.file(klumAnnotationsPom)
        inputs.file(klumRuntimePom)
        inputs.file(klumBomPom)
        systemProperty('klumAnnotationsJar', project(':klum-ast-annotations').tasks.named('jar').flatMap { it.archiveFile }.get().asFile)
        systemProperty('klumAnnotationsPom', klumAnnotationsPom.get().asFile)
        systemProperty('klumCompilerJar', tasks.named('jar').flatMap { it.archiveFile }.get().asFile)
        systemProperty('klumRuntimeJar', project(':klum-ast-runtime').tasks.named('jar').flatMap { it.archiveFile }.get().asFile)
        systemProperty('klumTestSupportJar', project(':klum-ast-test-support').tasks.named('jar').flatMap { it.archiveFile }.get().asFile)
        systemProperty('klumRuntimePom', klumRuntimePom.get().asFile)
        systemProperty('klumBomPom', klumBomPom.get().asFile)
        systemProperty('klumVersion', project.version.toString())
        systemProperty('klumJacksonJar', project(':klum-ast-jackson').tasks.named('jar').flatMap { it.archiveFile }.get().asFile)
        systemProperty('klumBeanValidationJar', project(':klum-ast-bean-validation').tasks.named('jar').flatMap { it.archiveFile }.get().asFile)
        systemProperty('jpmsAdapterModulePath', files(
                project(':klum-ast-jackson').configurations.runtimeClasspath,
                project(':klum-ast-bean-validation').configurations.runtimeClasspath
        ).asPath)
    }
}

// The shipping matrix starts many isolated Java 17 compilers. Keep it explicit and out of check.
def propagationQualification = 'com.blackbuild.klum.ast.AnnotationPropagationQualificationTest'
[3: 'test', 4: 'groovy4Tests', 5: 'groovy5Tests'].each { generation, lane ->
    tasks.named(lane, Test) {
        exclude '**/AnnotationPropagationQualificationTest*'
    }
    tasks.register("annotationPropagationArtifactsGroovy$generation", Test) {
        group = 'verification'
        description = "Qualifies actual propagation artifacts with Java 17 / Groovy $generation."
        dependsOn tasks.named(sourceSets[lane].classesTaskName)
        testClassesDirs = sourceSets[lane].output.classesDirs
        classpath = sourceSets[lane].runtimeClasspath
        useJUnitPlatform()
        filter { includeTestsMatching propagationQualification }
        maxParallelForks = 1
        inputs.dir file('src/test/fixtures/annotation-propagation-artifacts')
    }
}

dependencies {
    // all dependencies are compile time dependencies (for AST "runtime" is compile time of a client project")
    api project(':klum-ast-annotations')
    api project(':klum-ast-runtime')
    api libs.annodocimal.global.ast
    api libs.klum.cast.spi
    api libs.klum.cast.compile

    sharedTests libs.annodocimal.gradle.plugin
    sharedTests 'org.apache.ivy:ivy:2.5.3'
    testImplementation project(':klum-ast-test-support')
    groovy4TestsImplementation project(':klum-ast-test-support')
    groovy5TestsImplementation project(':klum-ast-test-support')
    testFixturesCompileOnly libs.bundles.spock.groovy.v3
    testFixturesCompileOnly libs.jb.anno
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from(components.java)
        }
    }
}
