plugins {
    id "klum-ast.multigroovy-conventions"
    id "klum-ast.jpms-descriptor-conventions"
    id "klum-ast.jacoco-conventions"
}

description = "Template test support for KlumAST"

dependencies {
    implementation project(':klum-ast-runtime')

    testImplementation project(':klum-ast')
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation libs.spock.g3
    groovy4TestsImplementation project(':klum-ast')
    groovy4TestsImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    groovy5TestsImplementation project(':klum-ast')
    groovy5TestsImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from(components.java)
        }
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    systemProperty 'klumProjectDirectory', rootProject.projectDir.absolutePath
    systemProperty 'klumVersion', rootProject.version.toString()
}

// Capture current source inputs, including local edits, without active build outputs or Git metadata.
def publicationSource = tasks.register('templateScopePublicationSource', Zip) {
    archiveFileName = 'publication-source.zip'
    destinationDirectory = layout.buildDirectory.dir('template-scope-publication')
    from(rootProject.projectDir) {
        include '*.gradle', 'gradle.properties', 'LICENSE', 'README.md'
        include 'buildSrc/*.gradle', 'buildSrc/src/**'
        rootProject.subprojects.each { include "${it.name}/build.gradle", "${it.name}/src/**" }
        exclude '**/build/**', '**/.gradle/**', '**/.git/**'
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def publicationRevision = providers.exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.get().trim()

tasks.named('test', Test) {
    dependsOn publicationSource
    inputs.file(publicationSource.flatMap { it.archiveFile })
    systemProperty 'klumPublicationSource', publicationSource.get().archiveFile.get().asFile.absolutePath
    systemProperty 'klumPublicationRevision', publicationRevision
}

['groovy4Tests', 'groovy5Tests'].each { lane ->
    sourceSets.named(lane) {
        groovy.exclude 'com/blackbuild/klum/ast/testsupport/TemplateScopePublishedConsumerTest.groovy'
    }
}
